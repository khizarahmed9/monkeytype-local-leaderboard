packages:
  - frontend
  - server
  - packages/*
  - frontend/storybook

allowBuilds:
  '@firebase/util': set this to true or false
  "@fortawesome/fontawesome-free": true
  "@parcel/watcher": true
  '@sentry/cli': set this to true or false
  core-js: true
  esbuild: true
  protobufjs: set this to true or false
  re2: set this to true or false

overrides:
  "postcss": "8.5.8"
engineStrict: true
saveExact: true
savePrefix: ""
