name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec turbo run ts-check lint build
      - run: pnpm exec turbo run test

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t monkeytype-local .
      - name: Serves the site and api
        run: |
          docker run -d --name app -p 5005:5005 monkeytype-local
          for _ in $(seq 1 30); do
            curl -sf localhost:5005/api/health && break
            sleep 1
          done
          curl -sf localhost:5005/ | grep -q '<html'
